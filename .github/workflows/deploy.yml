name: HarmonPush Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🚀 Deploy to cPanel via SSH/rsync
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🚚 Checkout repository
        uses: actions/checkout@v4

      - name: 🔑 Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/cpanel_deploy_key
          chmod 600 ~/.ssh/cpanel_deploy_key
          
          # Add the host to known_hosts to prevent the interactive prompt
          ssh-keyscan -p "${{ secrets.CPANEL_PORT }}" "${{ secrets.CPANEL_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 📂 Deploy via rsync
        shell: bash
        run: |
          set -Eeuo pipefail
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.CPANEL_PORT }} -i ~/.ssh/cpanel_deploy_key -o StrictHostKeyChecking=no" \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.vscode' \
            --exclude '.github' \
            --exclude 'dist' \
            --exclude '*.vsix' \
            ./ ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:~//public_html/
